# Keywords that decide which articles and datasets make it into the digest.
#
# Each term maps to a weight. Matching is case-insensitive on whole words, and
# multi-word phrases are fine ("European Central Bank"). End a term with * to
# match any word ending: "Serb*" matches Serb, Serbia, Serbian, Serbs.
#
# An item is included when ALL of these hold:
#   1. it matches at least one region term (or comes from a source tagged with a region)
#   2. it matches at least one topic term
#   3. its score >= scoring.threshold
#   4. its title matches no exclude term
#
# Score = sum of weights of every distinct matched term (region and topic).
# A term found in the title counts title_multiplier times its weight.
#
# Region and topic names (the [regions.X] / [topics.X] headers) are free-form; add,
# rename or remove them as needed. Region names are referenced from news_sources.toml
# and dataset_sources.toml.

# Articles whose title matches any of these are dropped.
exclude = ["Bundesliga", "football", "Champions League", "Eurovision", "horoscope", "recipe"]

[scoring]
threshold = 4
title_multiplier = 2
lookback_hours = 26
max_articles_per_region = 12
max_datasets = 8

