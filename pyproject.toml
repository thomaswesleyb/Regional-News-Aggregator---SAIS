[project]
name = "news-aggregator"
version = "0.1.0"
description = "Daily email digest of security, politics and economy news and datasets for Germany, the Balkans and Russia"
authors = [
    { name = "thomaswesleyb", email = "twesleybailey@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "feedparser==6.0.14",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "matplotlib==3.11.2",
    "openpyxl==3.1.5",
    "pandas==3.1.1",
    "trafilatura==2.3.1",
]

[project.scripts]
news-aggregator = "news_aggregator.cli:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis==6.170.14",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "ty==0.0.97",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PL", "RUF", "TID", "D"]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",  # docstrings only on non-trivial APIs
    "PLR2004",  # magic values read fine in heuristics and tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 8  # keyword-only args are fine; positional ones are capped below
max-positional-args = 5

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR0913"]

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
